<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">U6/U8 goal-kick placement</title><desc id="desc">Schematic field. For U6 and U8, place the ball anywhere on the goal line, not in the goal box. Opponents stay in their own half until the ball is in play.</desc>
  <rect x="35" y="25" width="570" height="370" rx="6" fill="#eaf5e8" stroke="#26734d" stroke-width="4"/><path d="M170 25v92h300V25M235 25v42h170V25" fill="none" stroke="#26734d" stroke-width="3"/><path d="M270 25v-16h100v16" fill="none" stroke="#263238" stroke-width="5"/><circle cx="220" cy="25" r="9" fill="#c62828" stroke="white" stroke-width="4"/><path d="M95 180h450" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 8"/><text x="320" y="165" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#173b2b">Ball on goal line, outside goal box</text><text x="320" y="205" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#315d47">Opponents remain in their own half</text><text x="320" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#315d47">Schematic, not to scale · PDSA Law 16</text>
</svg>
