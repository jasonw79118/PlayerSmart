<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">U6/U8 free kick near the goal box</title><desc id="desc">Schematic field. For U6 and U8, when the free kick is near the goal box, place the ball 4 yards from the goal-box line directly away from the goal.</desc>
  <rect x="35" y="25" width="570" height="370" rx="6" fill="#eaf5e8" stroke="#26734d" stroke-width="4"/><path d="M170 25v92h300V25M235 25v42h170V25" fill="none" stroke="#26734d" stroke-width="4"/><path d="M270 25v-16h100v16" fill="none" stroke="#263238" stroke-width="5"/><circle cx="320" cy="90" r="10" fill="#c62828" stroke="white" stroke-width="4"/><path d="M320 70v-18" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#263238"/></marker></defs><text x="335" y="78" font-family="sans-serif" font-size="16" fill="#173b2b">4 yd from goal-box line</text><text x="320" y="200" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#315d47">Directly away from goal</text><text x="320" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#315d47">Schematic, not to scale · PDSA Law 13</text>
</svg>
