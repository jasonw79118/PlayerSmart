<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Dropped-ball location</title><desc id="desc">Schematic field. The referee drops the ball at the position where it was when play stopped, subject to IFAB Law 8.</desc>
  <rect x="35" y="25" width="570" height="370" rx="6" fill="#eaf5e8" stroke="#26734d" stroke-width="4"/><path d="M320 25v370M258 210a62 62 0 1 0 124 0a62 62 0 1 0-124 0" fill="none" stroke="#26734d" stroke-width="2"/><circle cx="430" cy="270" r="10" fill="#c62828" stroke="white" stroke-width="4"/><path d="M430 230v24" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#263238"/></marker></defs><text x="430" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#173b2b">Ball's position when play stopped</text><text x="320" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#315d47">Schematic, not to scale · IFAB Law 8</text>
</svg>
