<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Goal-kick placement</title><desc id="desc">Schematic field. For divisions U10 and older, place the ball at any point within the goal area.</desc>
  <rect x="35" y="25" width="570" height="370" rx="6" fill="#eaf5e8" stroke="#26734d" stroke-width="4"/><path d="M170 25v92h300V25M235 25v42h170V25" fill="none" stroke="#26734d" stroke-width="3"/><path d="M270 25v-16h100v16" fill="none" stroke="#263238" stroke-width="5"/><circle cx="220" cy="85" r="9" fill="#c62828" stroke="white" stroke-width="4"/><text x="320" y="165" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#173b2b">Ball anywhere in goal area</text><text x="320" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#315d47">Schematic, not to scale · PDSA Law 16</text>
