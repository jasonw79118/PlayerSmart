<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Penalty-kick placement</title><desc id="desc">Schematic field. Place the ball on the penalty mark. Other players stay outside the penalty area and at least 10 yards from the mark.</desc>
  <rect x="35" y="25" width="570" height="370" rx="6" fill="#eaf5e8" stroke="#26734d" stroke-width="4"/><path d="M170 25v120h300V25M235 25v65h170V25M270 25v-16h100v16" fill="none" stroke="#26734d" stroke-width="3"/><circle cx="320" cy="112" r="10" fill="#c62828" stroke="white" stroke-width="4"/><path d="M320 95v-16" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#263238"/></marker></defs><text x="340" y="112" font-family="sans-serif" font-size="18" fill="#173b2b">Penalty mark</text><text x="320" y="215" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#315d47">Other players: outside area, at least 10 yd away</text><text x="320" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#315d47">Schematic, not to scale · PDSA Law 14</text>
</svg>
