name = "playersmart-askref"
main = "workers/askref.ts"
compatibility_date = "2026-10-27"
workers_dev = false

[ai]
binding = "AI"

[vars]
AI_GATEWAY_ID = "playersmart-askref"

[[ratelimits]]
name = "ASKREF_RATE_LIMITER"
